name: PR Strict Build Result

on:
  workflow_run:
    workflows: ['PR Strict Build Validation']
    types: [completed]

permissions:
  actions: read
  contents: write
  issues: write
  pull-requests: write

jobs:
  finalize:
    if: ${{ github.repository_owner == 'flybywiresim' && (github.event.workflow_run.conclusion == 'success' || github.event.workflow_run.conclusion == 'failure') }}
    runs-on: ubuntu-latest
    steps:
      - name: Download validation metadata
        uses: actions/download-artifact@v8
        with:
          name: strict-validation-metadata
          path: strict-validation
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Validate validation metadata
        id: metadata
        shell: bash
        run: |
          pr_number="$(<strict-validation/pr-number)"
          head_sha="$(<strict-validation/head-sha)"

          if [[ ! "$pr_number" =~ ^[1-9][0-9]*$ ]]; then
            echo 'Invalid PR number in validation metadata.' >&2
            exit 1
          fi

          if [[ ! "$head_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo 'Invalid head SHA in validation metadata.' >&2
            exit 1
          fi

          echo "pr_number=$pr_number" >> "$GITHUB_OUTPUT"
          echo "head_sha=$head_sha" >> "$GITHUB_OUTPUT"

      - name: Check whether result is still current
        id: current
        uses: actions/github-script@v9
        env:
          PR_NUMBER: ${{ steps.metadata.outputs.pr_number }}
          HEAD_SHA: ${{ steps.metadata.outputs.head_sha }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const pull_number = Number(process.env.PR_NUMBER);
            const approvedSha = process.env.HEAD_SHA;
            const { data: pr } = await github.rest.pulls.get({
              owner,
              repo,
              pull_number,
            });
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner,
              repo,
              pull_number,
              per_page: 100,
            });
            const hasApprovedLabel = pr.labels.some(label => label.name === 'Approved');
            const isOpen = pr.state === 'open';
            const isCurrentHead = pr.head.sha === approvedSha;
            const touchesWorkflows = files.some(file => file.filename.startsWith('.github/workflows/'));

            core.setOutput('should_finalize', String(hasApprovedLabel && isOpen && isCurrentHead));
            core.setOutput('touches_workflows', String(touchesWorkflows));

      - name: Comment on failed validation
        if: ${{ github.event.workflow_run.conclusion == 'failure' && steps.current.outputs.should_finalize == 'true' }}
        uses: actions/github-script@v9
        env:
          PR_NUMBER: ${{ steps.metadata.outputs.pr_number }}
        with:
          script: |
            await github.rest.issues.createComment({
              issue_number: Number(process.env.PR_NUMBER),
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: 'Strict Build Failed! ❌ - Please check out this PR locally to fix the issue before merging or see checks.',
            });

      - name: Reset labels after failed validation
        if: ${{ github.event.workflow_run.conclusion == 'failure' && steps.current.outputs.should_finalize == 'true' }}
        uses: actions/github-script@v9
        env:
          PR_NUMBER: ${{ steps.metadata.outputs.pr_number }}
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issue_number = Number(process.env.PR_NUMBER);

            await github.rest.issues.removeLabel({
              owner,
              repo,
              issue_number,
              name: 'Approved',
            });

            await github.rest.issues.addLabels({
              owner,
              repo,
              issue_number,
              labels: ['Review Required'],
            });

      - name: Comment on workflow-file manual merge requirement
        if: ${{ github.event.workflow_run.conclusion == 'success' && steps.current.outputs.should_finalize == 'true' && steps.current.outputs.touches_workflows == 'true' }}
        uses: actions/github-script@v9
        env:
          PR_NUMBER: ${{ steps.metadata.outputs.pr_number }}
        with:
          script: |
            await github.rest.issues.createComment({
              issue_number: Number(process.env.PR_NUMBER),
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: 'Strict Build Validated! Manual merge required because this PR changes files under `.github/workflows/`, and `GITHUB_TOKEN` cannot auto-merge workflow-file updates.',
            });

      - name: Merge validated PR
        if: ${{ github.event.workflow_run.conclusion == 'success' && steps.current.outputs.should_finalize == 'true' && steps.current.outputs.touches_workflows != 'true' }}
        uses: actions/github-script@v9
        env:
          PR_NUMBER: ${{ steps.metadata.outputs.pr_number }}
          HEAD_SHA: ${{ steps.metadata.outputs.head_sha }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const pull_number = Number(process.env.PR_NUMBER);
            const sha = process.env.HEAD_SHA;
            const { data: pr } = await github.rest.pulls.get({
              owner,
              repo,
              pull_number,
            });

            const hasApprovedLabel = pr.labels.some(label => label.name === 'Approved');
            if (!hasApprovedLabel || pr.state !== 'open' || pr.head.sha !== sha) {
              core.info('Pull request is no longer approved, open, or at the validated head; skipping merge.');
              return;
            }

            const { data } = await github.rest.pulls.merge({
              owner,
              repo,
              pull_number,
              sha,
              merge_method: 'squash',
            });

            if (!data.merged) {
              core.setFailed(`Pull request was not merged: ${data.message}`);
            }

name: PR Strict Build Result

on:
  workflow_run:
    workflows: ['PR Strict Build Validation']
    types: [completed]

permissions:
  actions: read
  contents: write
  issues: write
  pull-requests: write

jobs:
  finalize:
    if: ${{ github.repository_owner == 'flybywiresim' && (github.event.workflow_run.conclusion == 'success' || github.event.workflow_run.conclusion == 'failure') }}
    runs-on: ubuntu-latest
    steps:
      - name: Download validation metadata
        uses: actions/download-artifact@v8
        with:
          name: strict-validation-metadata
          path: strict-validation
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Load validation metadata
        id: metadata
        run: |
          echo "pr_number=$(cat strict-validation/pr-number)" >> "$GITHUB_OUTPUT"
          echo "head_sha=$(cat strict-validation/head-sha)" >> "$GITHUB_OUTPUT"

      - name: Check whether result is still current
        id: current
        uses: actions/github-script@v9
        with:
          script: |
            const { owner, repo } = context.repo;
            const pull_number = Number('${{ steps.metadata.outputs.pr_number }}');
            const approvedSha = '${{ steps.metadata.outputs.head_sha }}';
            const { data: pr } = await github.rest.pulls.get({
              owner,
              repo,
              pull_number,
            });
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner,
              repo,
              pull_number,
              per_page: 100,
            });
            const hasApprovedLabel = pr.labels.some(label => label.name === 'Approved');
            const isCurrentHead = pr.head.sha === approvedSha;
            const touchesWorkflows = files.some(file => file.filename.startsWith('.github/workflows/'));

            core.setOutput('should_finalize', String(hasApprovedLabel && isCurrentHead));
            core.setOutput('touches_workflows', String(touchesWorkflows));
            core.setOutput('title', pr.title);

      - name: Comment on failed validation
        if: ${{ github.event.workflow_run.conclusion == 'failure' && steps.current.outputs.should_finalize == 'true' }}
        uses: actions/github-script@v9
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: Number('${{ steps.metadata.outputs.pr_number }}'),
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: 'Strict Build Failed! ❌ - Please checkout this PR locally to fix the issue before merging or see checks.',
            });

      - name: Reset labels after failed validation
        if: ${{ github.event.workflow_run.conclusion == 'failure' && steps.current.outputs.should_finalize == 'true' }}
        uses: actions/github-script@v9
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issue_number = Number('${{ steps.metadata.outputs.pr_number }}');

            await github.rest.issues.removeLabel({
              owner,
              repo,
              issue_number,
              name: 'Approved',
            });

            await github.rest.issues.addLabels({
              owner,
              repo,
              issue_number,
              labels: ['Review Required'],
            });

      - name: Comment on workflow-file manual merge requirement
        if: ${{ github.event.workflow_run.conclusion == 'success' && steps.current.outputs.should_finalize == 'true' && steps.current.outputs.touches_workflows == 'true' }}
        uses: actions/github-script@v9
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: Number('${{ steps.metadata.outputs.pr_number }}'),
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: 'Strict Build Validated! Manual merge required because this PR changes files under `.github/workflows/`, and `GITHUB_TOKEN` cannot auto-merge workflow-file updates.',
            });

      - name: Automatically merge PR
        if: ${{ github.event.workflow_run.conclusion == 'success' && steps.current.outputs.should_finalize == 'true' && steps.current.outputs.touches_workflows != 'true' }}
        run: gh pr merge --squash --auto --subject "$PR_TITLE" "$PR_NUMBER"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.metadata.outputs.pr_number }}
          PR_TITLE: ${{ steps.current.outputs.title }}

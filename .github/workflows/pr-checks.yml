name: Build Checks and Auto Merge

on:
  pull_request_target:
    types: [opened, ready_for_review, synchronize, labeled, unlabeled]

jobs:
  verify-labels:
    runs-on: ubuntu-latest
    if: ${{ github.event.pull_request.draft == false }}
    permissions:
      issues: write
      pull-requests: write
    steps:
      - name: Reconcile review labels
        uses: actions/github-script@v9
        with:
          script: |
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const { data: pr } = await github.rest.pulls.get({
              owner,
              repo,
              pull_number: issue_number,
            });

            const labels = new Set(pr.labels.map(label => label.name));

            if (context.payload.action === 'synchronize' && labels.has('Approved')) {
              await github.rest.issues.removeLabel({
                owner,
                repo,
                issue_number,
                name: 'Approved',
              });
              labels.delete('Approved');
            }

            if (labels.has('Approved')) {
              if (labels.has('Review Required')) {
                await github.rest.issues.removeLabel({
                  owner,
                  repo,
                  issue_number,
                  name: 'Review Required',
                });
              }
              return;
            }

            if (!labels.has('Review Required')) {
              await github.rest.issues.addLabels({
                owner,
                repo,
                issue_number,
                labels: ['Review Required'],
              });

              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body: 'This PR is being prevented from merging because Review Required. Use the Approved label to run build validation and auto merge the PR.',
              });
            }

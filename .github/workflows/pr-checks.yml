name: Build Checks and Auto Merge

on:
  pull_request_target:
    types: [opened, ready_for_review, synchronize, labeled, unlabeled]

jobs:
  verify-labels:
    runs-on: ubuntu-latest
    if: ${{ github.event.pull_request.draft == false && github.repository_owner == 'flybywiresim' }}
    permissions:
      actions: write
      issues: write
      pull-requests: write
    steps:
      - name: Reconcile review labels
        uses: actions/github-script@v9
        with:
          script: |
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const { data: pr } = await github.rest.pulls.get({
              owner,
              repo,
              pull_number: issue_number,
            });

            const labels = new Set(pr.labels.map(label => label.name));

            if (context.payload.action === 'synchronize' && labels.has('Approved')) {
              await github.rest.issues.removeLabel({
                owner,
                repo,
                issue_number,
                name: 'Approved',
              });
              labels.delete('Approved');
            }

            if (labels.has('Approved')) {
              if (labels.has('Review Required')) {
                await github.rest.issues.removeLabel({
                  owner,
                  repo,
                  issue_number,
                  name: 'Review Required',
                });
              }
              return;
            }

            if (!labels.has('Review Required')) {
              await github.rest.issues.addLabels({
                owner,
                repo,
                issue_number,
                labels: ['Review Required'],
              });

              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body: 'This PR is being prevented from merging because Review Required. Use the Approved label to run build validation and auto merge the PR.',
              });
            }

      - name: Require approval label
        uses: actions/github-script@v9
        with:
          script: |
            const { owner, repo } = context.repo;
            const pull_number = context.payload.pull_request.number;
            const { data: pr } = await github.rest.pulls.get({
              owner,
              repo,
              pull_number,
            });
            const hasApprovedLabel = pr.labels.some(label => label.name === 'Approved');

            if (!hasApprovedLabel) {
              core.setFailed('Review Required: apply the Approved label before merging this pull request.');
            }

      - name: Start strict validation for approved PR
        if: ${{ github.event.action == 'labeled' && github.event.label.name == 'Approved' }}
        uses: actions/github-script@v9
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'pr-validate.yml',
              ref: context.payload.repository.default_branch,
              inputs: {
                pr_number: String(context.payload.pull_request.number),
                head_sha: context.payload.pull_request.head.sha,
                head_repository: context.payload.pull_request.head.repo.full_name,
              },
            });

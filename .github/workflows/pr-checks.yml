name: Build Checks and Auto Merge

on:
  pull_request_target:
    types: [opened, ready_for_review, synchronize, labeled, unlabeled]

jobs:
  verify-labels:
    runs-on: ubuntu-latest
    if: ${{ github.event.pull_request.draft == false && github.repository_owner == 'flybywiresim' }} # Prevent running on forks
    permissions:
      actions: write
      issues: write
      pull-requests: write
    steps:
      - name: Reset stale approval after new commits
        if: ${{ github.event.action == 'synchronize' && contains(github.event.pull_request.labels.*.name, 'Approved') }}
        uses: actions/github-script@v9
        with:
          script: |
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;

            await github.rest.issues.removeLabel({
              owner,
              repo,
              issue_number,
              name: 'Approved',
            });

            if (!context.payload.pull_request.labels.some(label => label.name === 'Review Required')) {
              await github.rest.issues.addLabels({
                owner,
                repo,
                issue_number,
                labels: ['Review Required'],
              });
            }

      - name: Ensure review is required when not approved
        if: ${{ !contains(github.event.pull_request.labels.*.name, 'Approved') && !contains(github.event.pull_request.labels.*.name, 'Review Required') }}
        uses: actions/github-script@v9
        with:
          script: |
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              labels: ['Review Required'],
            });

      - name: Clear review-required label after approval
        if: ${{ github.event.action != 'synchronize' && contains(github.event.pull_request.labels.*.name, 'Approved') && contains(github.event.pull_request.labels.*.name, 'Review Required') }}
        uses: actions/github-script@v9
        with:
          script: |
            await github.rest.issues.removeLabel({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              name: 'Review Required',
            });

      - name: Start strict validation for approved PR
        if: ${{ github.event.action == 'labeled' && github.event.label.name == 'Approved' }}
        uses: actions/github-script@v9
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'pr-validate.yml',
              ref: context.payload.repository.default_branch,
              inputs: {
                pr_number: String(context.payload.pull_request.number),
                head_sha: context.payload.pull_request.head.sha,
                head_repository: context.payload.pull_request.head.repo.full_name,
              },
            });

      - name: Comment on PR # Checks for Reviewed Required label and comments on PR
        id: check-labels
        uses: mheap/github-action-required-labels@v5
        with:
          mode: exactly
          count: 0
          labels: "Review Required"
          add_comment: true
          message: "This PR is being prevented from merging because {{ provided }}. Use the Approved label to run build validation and auto merge the PR."
